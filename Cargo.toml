[package]
name = "yasal"
version = "0.1.0"
edition = "2021"
description = "Lightweight Windows Command Palette"

[dependencies]
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts"] }
window-vibrancy = "0.5"
raw-window-handle = "0.6"
global-hotkey = "0.6"
tray-icon = "0.19"
nucleo-matcher = "0.3"
evalexpr = "11.3"
open = "5.3"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Com",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
